[project]
name = "ferrumfs"
version = "0.1.0"
description = "Files stored in a magnetic field: coil TX, magnetometer RX, FEC, FUSE."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["reedsolo>=1.7", "pyserial>=3.5", "typer>=0.12", "rich>=13"]

[project.optional-dependencies]
fuse = ["fusepy>=3.0"]

[project.scripts]
ferrum = "ferrumfs.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
