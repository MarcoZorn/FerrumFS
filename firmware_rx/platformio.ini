; RX just samples and streams CSV; the demodulator lives on the host
; (same code the channel simulator tests).

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600

; analog Hall (SS49E / DRV5053) on ADC: 4 kHz, up to ~500 bps
[env:rx_hall]
build_flags = -DSENSOR_HALL -DFS_HZ=4000

; QMC5883L 3-axis over I2C: 200 Hz ODR, ~25 bps, orientation invariant
[env:rx_qmc]
build_flags = -DSENSOR_QMC -DFS_HZ=200
